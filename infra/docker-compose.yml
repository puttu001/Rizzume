# Local dev orchestration. Run from repo root:
#   docker compose -f infra/docker-compose.yml up --build
#
# Every service loads its own services/<name>/.env, which already points at
# the real hosted Neon (Postgres) / Upstash (Redis) / Azure Blob Storage
# instances used everywhere else in this project (see current_state.md) —
# there is no local Postgres/Redis/MinIO here. The only `environment:`
# overrides below are the handful of *inter-service* URLs that must resolve
# to Docker's internal container hostnames instead of `localhost` once
# everything is on the compose network.
#
# report-service is deliberately not included: nothing in the working flow
# calls it yet, and its .env still has placeholder (non-hosted) values —
# see current_state.md.
#
# Host-side ports are 18000-18004, not 8000-8004: Windows/Hyper-V (WSL2,
# Docker Desktop's backend) reserves a dynamic NAT port-exclusion range that
# on this machine happens to be 7987-8086, so binding 8000-8004 on the host
# fails with "bind: An attempt was made to access a socket in a way
# forbidden by its access permissions" — not a compose bug. Doesn't affect
# container-to-container URLs below (those never touch the host network
# stack). If this range shifts back to not colliding, these could move back
# to 8000-8004; `netsh interface ipv4 show excludedportrange protocol=tcp`
# shows the current reserved ranges. `net stop winnat && net start winnat`
# (needs an elevated shell) often reclaims the original ports instead.

name: rizzume

services:
  api-gateway:
    build: ../services/api-gateway
    env_file: ../services/api-gateway/.env
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
      INTERVIEW_SERVICE_URL: http://interview-service:8000
      AUDIO_SERVICE_URL: http://audio-service:8000
    ports:
      - "18000:8000"
    depends_on:
      - auth-service
      - interview-service
      - audio-service

  auth-service:
    build: ../services/auth-service
    env_file: ../services/auth-service/.env
    ports:
      - "18001:8000"

  interview-service:
    build: ../services/interview-service
    env_file: ../services/interview-service/.env
    environment:
      CONVERSATION_SERVICE_URL: http://conversation-service:8000
    ports:
      - "18002:8000"

  conversation-service:
    build: ../services/conversation-service
    env_file: ../services/conversation-service/.env
    ports:
      - "18003:8000"

  audio-service:
    build: ../services/audio-service
    env_file: ../services/audio-service/.env
    ports:
      - "18004:8000"

  audio-worker:
    build: ../services/audio-service
    env_file: ../services/audio-service/.env
    command: ["uv", "run", "celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:18000
    env_file: ../frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
